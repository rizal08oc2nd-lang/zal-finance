
name: Build Zal Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p /tmp/zf
          unzip -q ZalFinance_Android_Starter.zip -d /tmp/zf
          PROJECT_DIR=$(find /tmp/zf -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found in ZIP"
            find /tmp/zf -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "Project found: $PROJECT_DIR"
          rsync -a --exclude='.github/' "$PROJECT_DIR/" ./

      - name: Set JVM target to 17
        run: |
          find . -name build.gradle -o -name build.gradle.kts
          if [ -f app/build.gradle ]; then
            sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle
          elif [ -f app/build.gradle.kts ]; then
            sed -i 's/JVM_1_8/JVM_17/g' app/build.gradle.kts
            sed -i 's/"1.8"/"17"/g' app/build.gradle.kts
          else
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zal-Finance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
