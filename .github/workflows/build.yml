
name: Build Zal Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p /tmp/zf
          unzip -q ZalFinance_Android_Starter.zip -d /tmp/zf
          PROJECT_DIR=$(find /tmp/zf -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          rsync -a --exclude='.github/' "$PROJECT_DIR/" ./

      - name: Build APK
        run: |
          cat > /tmp/force-java17.gradle <<'EOF'
          allprojects {
            afterEvaluate {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
              }
            }
          }
          EOF
          gradle --init-script /tmp/force-java17.gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zal-Finance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
